<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SerrasPro — Auto Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              300: '#FDBA74',
              400: '#FB923C',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
              800: '#7C2D12',
              900: '#5C1D0D',
              950: '#3B1208'
            }
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif']
          },
          boxShadow: {
            'marca': '0 2px 8px rgba(124,45,18,0.10)',
            'marca-md': '0 4px 16px rgba(124,45,18,0.12)',
            'marca-lg': '0 8px 30px rgba(124,45,18,0.18)',
            'elevated': '0 8px 40px rgba(0,0,0,0.35)',
            'inner-screen': 'inset 0 2px 12px rgba(0,0,0,0.15)',
            'nav': '0 -1px 6px rgba(0,0,0,0.08)'

          borderRadius: {
            'marca': '12px',
            'marca-lg': '16px',
            'marca-xl': '20px'
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes telaEntrar {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) {
      animation: telaEntrar 0.22s ease-out forwards;
    }

    .ativo {
      color: #F97316 !important;
    }
    .ativo::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2.5px;
      background: #F97316;
      border-radius: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }
    .badge-ok   { background: #D1FAE5; color: #065F46; }
    .badge-warn { background: #FEF3C7; color: #92400E; }
    .badge-err  { background: #FEE2E2; color: #991B1B; }
    .badge-info { background: #FFEDD5; color: #7C2D12; }
    .badge-muted{ background: #F3F4F6; color: #6B7280; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(124,45,18,0.10);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(124,45,18,0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); opacity: 0.92; }
    .btn-primary { background: #F97316; color: #fff; }
    .btn-primary:hover { background: #EA580C; }
    .btn-dark { background: #7C2D12; color: #fff; }
    .btn-dark:hover { background: #5C1D0D; }
    .btn-outline {
      background: transparent;
      color: #7C2D12;
      border: 1.5px solid #7C2D12;
    }
    .btn-ghost {
      background: transparent;
      color: #7C2D12;
      padding: 8px 14px;
    }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }

    .scroll-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(124,45,18,0.15) transparent;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: rgba(124,45,18,0.18); border-radius: 4px; }

    .input-campo {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #1F2937;
      background: #fff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-campo:focus {
      border-color: #F97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
    }
    .input-campo::placeholder { color: #9CA3AF; }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .aviso {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      z-index: 200;
      pointer-events: none;
      animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0); }
      to   { opacity: 0; transform: translateX(-50%) translateY(12px); }
    }

    :focus-visible {
      outline: 2px solid #F97316;
      outline-offset: 2px;
    }

    .status-ponto { width: 8px; height: 8px; border-radius: 50%; }
    .status-ponto.pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .linha-clicavel {
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .linha-clicavel:active {
      background-color: #FFF7ED;
    }

    @media (min-width: 431px) {
      #moldura {
        width: 390px;
        height: 844px;
        border-radius: 40px;
        border: 3px solid #2a2a2a;
        box-shadow: 0 0 0 3px #111, 0 20px 60px rgba(0,0,0,0.6);
        overflow: hidden;
        position: relative;
      }
      #moldura::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        background: #000;
        border-radius: 37px 37px 0 0;
        z-index: 50;
      }
    }
    @media (max-width: 430px) {
      #moldura {
        width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        overflow: hidden;
      }
    }
  </style>
</head>

      container.innerHTML = ordens_de_servico_dados.map((os, i) => {

        const inicial = os.cliente.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
        const hue = (i * 47 + 15) % 360;
        const corAvatar = `hsl(${hue}, 55%, 42%)`;
        const dataHoje = '2026-01-15';
        const isToday = os.data === dataHoje;
        const dataExib = isToday ? `Hoje, ${os.hora}` : dataBR(os.data);
        return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100 active:scale-[0.98] transition-all duration-200 cursor-pointer"
             onclick="ordens_de_servico_abrirDetalhe('${os.numero}')">
          <div class="flex items-start justify-between mb-2.5">
            <div class="flex items-center gap-2.5">

                <div class="font-bold text-stone-800 text-sm font-display leading-tight">${os.numero}</div>
                <div class="text-xs text-stone-400 mt-0.5">${dataExib}</div>

            <div class="text-sm font-semibold text-stone-700">${os.cliente}</div>
            <div class="text-xs text-stone-500 mt-1">${os.veiculo} ${os.ano} &bull; ${os.cor} &bull; ${os.placa} &bull; ${os.km.toLocaleString('pt-BR')} km</div>
            <div class="flex items-center gap-1.5 mt-1.5">
              <svg class="w-3.5 h-3.5 text-stone-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg>
              <span class="text-xs text-stone-500">${mec}</span>

      ordens_de_servico_aplicarFiltros();

    function ordens_de_servico_aplicarFiltros() {
      const busca = document.getElementById('search-os').value.toLowerCase().trim();
      const filtro = document.querySelector('.ordens-filtro-btn.bg-marca-700');
      const statusAtivo = filtro ? filtro.dataset.filtro : 'todos';
      const mecanicoAtivo = document.getElementById('filter-mecanico').value;
      const cards = document.querySelectorAll('#lista-os > div');
      let visiveis = 0;
      cards.forEach(card => {
        const os = ordens_de_servico_dados.find(o => card.innerHTML.includes(o.numero));
        if (!os) return;
        const matchBusca = !busca ||
          os.numero.toLowerCase().includes(busca) ||
          os.cliente.toLowerCase().includes(busca) ||
          os.veiculo.toLowerCase().includes(busca) ||
          os.placa.toLowerCase().includes(busca);
        const matchStatus = statusAtivo === 'todos' || os.status === statusAtivo;
        const matchMecanico = mecanicoAtivo === 'todos' || os.mecanico === mecanicoAtivo;
        if (matchBusca && matchStatus && matchMecanico) {
          card.classList.remove('hidden');
          visiveis++;
        } else {
          card.classList.add('hidden');
        }
      });
      document.getElementById('result-count').textContent = `Exibindo ${visiveis} de ${ordens_de_servico_dados.length} OS`;
      document.getElementById('empty-os').classList.toggle('hidden', visiveis > 0);
      document.getElementById('lista-os').classList.toggle('hidden', visiveis === 0);
    }

    function ordens_de_servico_abrirDetalhe(numero) {
      const os = ordens_de_servico_dados.find(o => o.numero === numero);
      if (!os) return;
      const st = ordens_de_servico_statusMap[os.status];
      const mec = ordens_de_servico_mecanicos[os.mecanico];
      const inicial = os.cliente.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase();
      const hue = ordens_de_servico_dados.indexOf(os) * 47 + 15;
      const isAcao = ['aguardando','diagnostico'].includes(os.status);
      const isAndamento = os.status === 'andamento';
      const isFinalizado = os.status === 'finalizado';
      const isEntregue = os.status === 'entregue';
      const isCancelado = os.status === 'cancelado';
      const icone = ordens_de_servico_iconeStatus[os.status];
      let acoes = '';
      if (isAcao) acoes += `<button onclick="ordens_de_servico_acao('${os.numero}','iniciar')" class="flex-1 bg-marca-600 hover:bg-marca-700 active:scale-95 text-white py-3 rounded-xl font-semibold text-sm transition-all">Iniciar Serviço</button>`;
      else if (isAndamento) acoes += `<button onclick="ordens_de_servico_acao('${os.numero}','finalizar')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3 rounded-xl font-semibold text-sm transition-all">Finalizar Serviço</button>`;
      else if (isFinalizado) acoes += `<button onclick="ordens_de_servico_acao('${os.numero}','entregar')" class="flex-1 bg-marca-600 hover:bg-marca-700 active:scale-95 text-white py-3 rounded-xl font-semibold text-sm transition-all">Registrar Entrega</button>`;
      if (!isCancelado && !isEntregue) acoes += `<button onclick="ordens_de_servico_acao('${os.numero}','cancelar')" class="px-4 bg-red-50 hover:bg-red-100 active:scale-95 text-red-600 py-3 rounded-xl font-semibold text-sm transition-all border border-red-200">Cancelar</button>`;
      const totalPecas = os.pecas.reduce((s, p) => s + (p.valor || p.val || 0), 0);
      const total = (os.valor || 0) + totalPecas;
      const pecasHtml = os.pecas.length > 0 ? `
        <div class="bg-stone-50 rounded-xl p-3">
          <div class="text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wider">Peças Utilizadas</div>
          ${os.pecas.map(p => `<div class="flex justify-between text-xs py-1.5 border-b border-stone-100 last:border-0"><span class="text-stone-600">${p.nome} <span class="text-stone-400">x${p.qtd}</span></span><span class="font-semibold text-stone-700">${brl(p.valor || p.val || 0)}</span></div>`).join('')}
          <div class="flex justify-between text-xs pt-2 mt-1 border-t border-stone-200 font-bold text-stone-800"><span>Total Peças</span><span>${brl(totalPecas)}</span></div>
        </div>` : '<p class="text-xs text-stone-400 italic">Nenhuma peça registrada</p>';

      const html = `
        <div class="flex flex-col h-full">
          <div class="p-5 pb-4 bg-gradient-to-br from-marca-800 to-marca-900 text-white relative overflow-hidden flex-shrink-0">
            <div class="absolute top-0 right-0 w-32 h-32 rounded-full bg-marca-600 opacity-20 -translate-y-8 translate-x-8"></div>
            <div class="absolute bottom-0 left-0 w-20 h-20 rounded-full bg-marca-500 opacity-15 translate-y-6 -translate-x-6"></div>
            <div class="relative">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-12 h-12 rounded-xl bg-white/15 backdrop-blur flex items-center justify-center text-xl font-bold">${inicial}</div>
                <div><div class="font-bold text-lg font-display">${os.numero}</div><div class="text-xs text-marca-100">${dataBR(os.data)} &bull; ${os.hora}</div></div>
              </div>
              <div class="flex items-center justify-between">
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white/15 backdrop-blur rounded-full text-xs font-semibold"><span>${icone}</span>${st.label}</span>
                <span class="text-2xl font-bold">${brl(total)}</span>
              </div>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto overscroll-none p-5 space-y-4">
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center flex-shrink-0"><svg class="w-4 h-4 text-marca-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg></div>
              <div><div class="text-xs text-stone-400">Cliente</div><div class="text-sm font-semibold text-stone-700">${os.cliente}</div></div>
            </div>
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center flex-shrink-0"><svg class="w-4 h-4 text-marca-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg></div>
              <div><div class="text-xs text-stone-400">Veículo</div><div class="text-sm font-semibold text-stone-700">${os.veiculo} ${os.ano} &bull; ${os.cor}</div><div class="text-xs text-stone-500">${os.placa} &bull; ${os.km.toLocaleString('pt-BR')} km</div></div>

            <div class="bg-stone-50 rounded-xl p-3">
              <div class="text-xs font-semibold text-stone-500 mb-1 uppercase tracking-wider">Problema Relatado</div>

              <div class="bg-stone-50 rounded-xl p-3">
                <p class="text-sm text-stone-600 font-medium">${os.servico}</p>
                <div class="text-right mt-1"><span class="text-sm font-bold text-marca-700">${brl(os.valor)}</span><span class="text-xs text-stone-400 ml-1">mão de obra</span></div>
              </div>
            </div>
            ${pecasHtml}
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center flex-shrink-0"><svg class="w-4 h-4 text-marca-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a17.933 17.933 0 0112 2.632 17.933 17.933 0 012.632-12"/></svg></div>
              <div><div class="text-xs text-stone-400">Mecânico Responsável</div><div class="text-sm font-semibold text-stone-700">${mec}</div></div>
            </div>
            <div class="bg-marca-50/50 rounded-xl p-3 border border-marca-100">
              <div class="text-xs font-semibold text-marca-700 mb-2 uppercase tracking-wider">Timeline</div>
              <div class="space-y-3">
                <div class="flex gap-2.5"><div class="flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full bg-marca-500 mt-0.5"></div><div class="w-px h-full bg-marca-200"></div></div><div><div class="text-xs font-semibold text-stone-600">OS Aberta</div><div class="text-[10px] text-stone-400">${dataBR(os.data)} &bull; ${os.hora}</div></div></div>
                ${!['aguardando','cancelado'].includes(os.status) ? `<div class="flex gap-2.5"><div class="flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full bg-orange-400 mt-0.5"></div><div class="w-px h-full bg-stone-200"></div></div><div><div class="text-xs font-semibold text-stone-600">Serviço Iniciado</div><div class="text-[10px] text-stone-400">Em andamento</div></div></div>` : ''}
                ${['finalizado','entregue'].includes(os.status) ? `<div class="flex gap-2.5"><div class="flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full bg-emerald-500 mt-0.5"></div><div class="w-px h-full bg-stone-200"></div></div><div><div class="text-xs font-semibold text-stone-600">Serviço Finalizado</div><div class="text-[10px] text-stone-400">Pronto para entrega</div></div></div>` : ''}
                ${isEntregue ? `<div class="flex gap-2.5"><div class="flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full bg-stone-400 mt-0.5"></div></div><div><div class="text-xs font-semibold text-stone-600">Entregue ao Cliente</div><div class="text-[10px] text-stone-400">Concluído</div></div></div>` : ''}
                ${isCancelado ? `<div class="flex gap-2.5"><div class="flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full bg-red-400 mt-0.5"></div></div><div><div class="text-xs font-semibold text-red-600">Ordem Cancelada</div><div class="text-[10px] text-stone-400">Serviço não realizado</div></div></div>` : ''}

      abrirModal(html, os.numero + ' — Detalhes');
      setTimeout(() => { const btn = document.querySelector('.modal-close-btn'); if(btn) btn.onclick = fecharModal; }, 50);
    }

    function ordens_de_servico_acao(numero, acao) {
      const os = ordens_de_servico_dados.find(o => o.numero === numero);
      if (!os) return;
      const msgs = { iniciar: `Serviço de ${os.numero} iniciado com sucesso!`, finalizar: `${os.numero} finalizada! Pronta para entrega.`, entregar: `${os.numero} entregue ao cliente com sucesso!`, cancelar: `${os.numero} foi cancelada.` };
      if (acao === 'cancelar') {
        const confirmHtml = `<div class="text-center py-4"><div class="w-14 h-14 mx-auto bg-red-100 rounded-full flex items-center justify-center mb-3"><svg class="w-7 h-7 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg></div><p class="text-sm text-stone-600 mb-1">Cancelar <strong>${os.numero}</strong>?</p><p class="text-xs text-stone-400">Esta ação não pode ser desfeita.</p></div>`;
        abrirModal(confirmHtml, 'Confirmar Cancelamento');
        setTimeout(() => {
          const simBtn = document.querySelector('.modal-close-btn');
          const modalFooter = document.querySelector('#modal-container .modal-footer-area');
          if (modalFooter) {
            modalFooter.innerHTML = `<button onclick="fecharModal();ordens_de_servico_executarAcao('${numero}','cancelar')" class="flex-1 bg-red-500 hover:bg-red-600 active:scale-95 text-white py-3 rounded-xl font-semibold text-sm transition-all">Sim, Cancelar</button><button onclick="fecharModal()" class="flex-1 bg-stone-100 hover:bg-stone-200 active:scale-95 text-stone-700 py-3 rounded-xl font-semibold text-sm transition-all">Voltar</button>`;
          }
        }, 80);
        return;
      }
      ordens_de_servico_executarAcao(numero, acao);
    }

    function ordens_de_servico_executarAcao(numero, acao) {
      const os = ordens_de_servico_dados.find(o => o.numero === numero);
      if (!os) return;
      const mapa = { iniciar: 'andamento', finalizar: 'finalizado', entregar: 'entregue', cancelar: 'cancelado' };
      os.status = mapa[acao] || os.status;
      fecharModal();
      toast(ordens_de_servico_acao.msg || `${os.numero} atualizada!`, 'ok');
      setTimeout(() => { ordens_de_servico_inicializar(); }, 350);
    }

    function ordens_de_servico_setFilter(f) {
      document.querySelectorAll('.ordens-filtro-btn').forEach(btn => {
        if (btn.dataset.filtro === f) {
          btn.className = 'ordens-filtro-btn flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition-all bg-marca-700 text-white';
        } else {
          btn.className = 'ordens-filtro-btn flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition-all bg-stone-100 text-stone-600 hover:bg-stone-200';
        }
      });
      ordens_de_servico_aplicarFiltros();
    }

    function ordens_de_servico_clearSearch() {
      const input = document.getElementById('search-os');
      input.value = '';
      document.getElementById('clear-search').classList.add('hidden');
      ordens_de_servico_aplicarFiltros();
      input.focus();
    }

    function ordens_de_servico_atualizarIndicadores() {
      const cnt = { aguardando: 0, diagnostico: 0, pecas: 0, andamento: 0 };
      ordens_de_servico_dados.forEach(o => { if (cnt[o.status] !== undefined) cnt[o.status]++; });
      document.getElementById('ind-aguardando').textContent = cnt.aguardando + cnt.diagnostico;
      document.getElementById('ind-diagnostico').textContent = cnt.diagnostico;
      document.getElementById('ind-pecas').textContent = cnt.pecas;
      document.getElementById('ind-andamento').textContent = cnt.andamento;
    }

    let ordens_de_servico_pty = null, ordens_de_servico_pulling = false, ordens_de_servico_pyStart = 0;
    function ordens_de_servico_ptrStart(e) {
      const el = document.getElementById('lista-os');
      if (el && el.scrollTop === 0) {
        ordens_de_servico_pyStart = e.touches[0].clientY;
        ordens_de_servico_pty = e.touches[0].clientY;
      }
    }
    function ordens_de_servico_ptrMove(e) {
      if (ordens_de_servico_pulling) return;
      const el = document.getElementById('lista-os');
      if (!el || el.scrollTop > 0) return;
      const dy = e.touches[0].clientY - ordens_de_servico_pyStart;
      if (dy > 65) {
        ordens_de_servico_pulling = true;
        const ptr = document.getElementById('ptr-os');
        ptr.classList.remove('opacity-0');
        ptr.classList.add('opacity-100');
        setTimeout(() => {
          ptr.classList.remove('opacity-100');
          ptr.classList.add('opacity-0');
          ordens_de_servico_pulling = false;
          toast('Lista atualizada!', 'ok');
        }, 1800);
      }
    }
    document.addEventListener('touchstart', ordens_de_servico_ptrStart, { passive: true });
    document.addEventListener('touchmove', ordens_de_servico_ptrMove, { passive: true });

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-os');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          const btn = document.getElementById('clear-search');
          if (searchInput.value.trim()) btn.classList.remove('hidden'); else btn.classList.add('hidden');
          ordens_de_servico_aplicarFiltros();
        });
      }
      const section = document.getElementById('ordens-de-servico');
      if (section) {
        const obs = new MutationObserver(() => {
          if (!section.classList.contains('hidden')) {
            ordens_de_servico_atualizarIndicadores();
            searchInput.value = '';
            document.getElementById('clear-search').classList.add('hidden');
            ordens_de_servico_setFilter('todos');
            document.getElementById('filter-mecanico').value = 'todos';
            ordens_de_servico_aplicarFiltros();
          }
        });
        obs.observe(section, { attributes: true, attributeFilter: ['class'] });
      }
    });

    window.ordens_de_servico_inicializar = ordens_de_servico_inicializar;
    window.ordens_de_servico_aplicarFiltros = ordens_de_servico_aplicarFiltros;
    window.ordens_de_servico_setFilter = ordens_de_servico_setFilter;
    window.ordens_de_servico_clearSearch = ordens_de_servico_clearSearch;
    window.ordens_de_servico_abrirDetalhe = ordens_de_servico_abrirDetalhe;
    window.ordens_de_servico_acao = ordens_de_servico_acao;
    window.ordens_de_servico_executarAcao = ordens_de_servico_executarAcao;
    window.ordens_de_servico_atualizarIndicadores = ordens_de_servico_atualizarIndicadores;
    </script>

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <span class="text-[10px] font-semibold text-gray-400 mt-0.5">Nova OS</span>
        </button>
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 text-gray-400 flex-1" data-nav="financeiro" onclick="mostrarTela('financeiro')" role="tab" aria-selected="false" aria-label="Financeiro">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span class="text-[10px] font-semibold">Caixa</span>
        </button>
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 text-gray-400 flex-1" data-nav="relatorios" onclick="mostrarTela('relatorios')" role="tab" aria-selected="false" aria-label="Relatórios">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 5 4-3"/></svg>
          <span class="text-[10px] font-semibold">Relatórios</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b) {
        var ehAtivo = b.dataset.nav === id;
        b.classList.toggle('ativo', ehAtivo);
        b.classList.toggle('text-marca-500', ehAtivo);
        b.classList.toggle('text-gray-400', !ehAtivo);
        b.setAttribute('aria-selected', ehAtivo ? 'true' : 'false');
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function() {
      mostrarTela('dashboard');
    });

    var contadorAvisos = 0;
    function toast(mensagem, tipo) {
      tipo = tipo || 'info';
      var el = document.createElement('div');
      el.className = 'aviso';
      var cores = { ok: '#059669', erro: '#DC2626', info: '#F97316' };
      el.style.background = cores[tipo] || cores.info;
      el.textContent = mensagem;
      document.body.appendChild(el);
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
    }

    function abrirModal(html, titulo) {
      var container = document.getElementById('modal-container');
      container.innerHTML =
        '<div class="fixed inset-0 z-[150] flex items-end sm:items-center justify-center" onclick="if(event.target===this)fecharModal()">' +
          '<div class="absolute inset-0 bg-black/50"></div>' +
          '<div class="relative bg-white rounded-t-marca-xl sm:rounded-marca-xl w-full max-w-sm shadow-elevated overflow-hidden">' +
            '<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">' +
              '<h3 class="font-body font-bold text-base text-marca-800">' + (titulo || '') + '</h3>' +
              '<button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors" aria-label="Fechar">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
              '</button>' +
            '</div>' +
            '<div class="p-5 max-h-[70vh] overflow-y-auto">' + html + '</div>' +
          '</div>' +
        '</div>';
    }

    function fecharModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function dataBR(iso) {
      if (!iso) return '—';
      var partes = iso.split('-');
      return partes[2] + '/' + partes[1] + '/' + partes[0];
    }

    function gerarIniciais(nome) {
      if (!nome) return '?';
      var p = nome.trim().split(/\s+/);
      return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
    }

    function corAvatar(nome) {
      var cores = ['#7C2D12','#B45309','#C2410C','#059669','#0891B2','#7C3AED','#BE185D','#4338CA'];
      var hash = 0;
      for (var i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
      return cores[Math.abs(hash) % cores.length];
    }
  </script>
</body>
</html>
