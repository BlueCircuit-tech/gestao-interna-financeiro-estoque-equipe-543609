<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SerrasPro — Auto Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              300: '#FDBA74',
              400: '#FB923C',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
              800: '#7C2D12',
              900: '#5C1D0D',
              950: '#3B1208'
            }
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif']
          },
          boxShadow: {
            'marca': '0 2px 8px rgba(124,45,18,0.10)',
            'marca-md': '0 4px 16px rgba(124,45,18,0.12)',
            'marca-lg': '0 8px 30px rgba(124,45,18,0.18)',
            'elevated': '0 8px 40px rgba(0,0,0,0.35)',
            'inner-screen': 'inset 0 2px 12px rgba(0,0,0,0.15)',
            'nav': '0 -1px 6px rgba(0,0,0,0.08)'
          },
          borderRadius: {
            'marca': '12px',
            'marca-lg': '16px',
            'marca-xl': '20px'
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes telaEntrar {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) {
      animation: telaEntrar 0.22s ease-out forwards;
    }

    .ativo {
      color: #F97316 !important;
    }
    .ativo::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2.5px;
      background: #F97316;
      border-radius: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }
    .badge-ok   { background: #D1FAE5; color: #065F46; }
    .badge-warn { background: #FEF3C7; color: #92400E; }
    .badge-err  { background: #FEE2E2; color: #991B1B; }
    .badge-info { background: #FFEDD5; color: #7C2D12; }
    .badge-muted{ background: #F3F4F6; color: #6B7280; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(124,45,18,0.10);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(124,45,18,0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); opacity: 0.92; }
    .btn-primary { background: #F97316; color: #fff; }
    .btn-primary:hover { background: #EA580C; }
    .btn-dark { background: #7C2D12; color: #fff; }
    .btn-dark:hover { background: #5C1D0D; }
    .btn-outline {
      background: transparent;
      color: #7C2D12;
      border: 1.5px solid #7C2D12;
    }
    .btn-ghost {
      background: transparent;
      color: #7C2D12;
      padding: 8px 14px;
    }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }

    .scroll-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(124,45,18,0.15) transparent;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: rgba(124,45,18,0.18); border-radius: 4px; }

    .input-campo {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #1F2937;
      background: #fff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-campo:focus {
      border-color: #F97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
    }
    .input-campo::placeholder { color: #9CA3AF; }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .aviso {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      z-index: 200;
      pointer-events: none;
      animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(-50%) translateY(0); }
      to   { opacity: 0; transform: translateX(-50%) translateY(12px); }
    }

    :focus-visible {
      outline: 2px solid #F97316;
      outline-offset: 2px;
    }

    .status-ponto { width: 8px; height: 8px; border-radius: 50%; }
    .status-ponto.pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .linha-clicavel {
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .linha-clicavel:active {
      background-color: #FFF7ED;
    }

    @media (min-width: 431px) {
      #moldura {
        width: 390px;
        height: 844px;
        border-radius: 40px;
        border: 3px solid #2a2a2a;
        box-shadow: 0 0 0 3px #111, 0 20px 60px rgba(0,0,0,0.6);
        overflow: hidden;
        position: relative;
      }
      #moldura::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        background: #000;
        border-radius: 37px 37px 0 0;
        z-index: 50;
      }
    }
    @media (max-width: 430px) {
      #moldura {
        width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        overflow: hidden;
      }
    }
  </style>
</head>
<body class="bg-neutral-800">
  <div id="moldura" class="bg-marca-50 flex flex-col h-full relative">
    <div class="flex flex-col h-full relative z-10">

      <header id="app-header" class="bg-marca-800 text-white flex items-center px-4 shrink-0 relative z-40" style="height:48px; padding-top: env(safe-area-inset-top, 0px);">
        <div class="flex items-center gap-2 flex-1">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#F97316"/>
            <path d="M8 20L12 12L16 17L20 10L24 20" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="24" cy="20" r="2" fill="#fff"/>
          </svg>
          <span class="font-display text-xl tracking-wide leading-none">SerrasPro</span>
        </div>
        <button class="relative p-1" aria-label="Notificações" onclick="mostrarTela('notificacoes')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-red-500 rounded-full text-white text-[9px] font-bold flex items-center justify-center">3</span>
        </button>
      </header>

      <main class="scroll-area flex-1 relative">
        <div id="container-telas" class="relative">
          <!-- TELAS -->
        </div>
      </main>

      <nav class="shrink-0 bg-white border-t border-gray-100 flex items-center justify-around z-40" style="box-shadow: 0 -1px 6px rgba(0,0,0,0.06);" role="tablist" aria-label="Navegação principal">
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 text-gray-400 flex-1" data-nav="dashboard" onclick="mostrarTela('dashboard')" role="tab" aria-selected="false" aria-label="Dashboard">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="text-[10px] font-semibold">Início</span>
        </button>
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 text-gray-400 flex-1" data-nav="ordens-de-servico" onclick="mostrarTela('ordens-de-servico')" role="tab" aria-selected="false" aria-label="Ordens de Serviço">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span class="text-[10px] font-semibold">OS</span>
        </button>
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 flex-1" data-nav="nova-ordem-de-servico" onclick="mostrarTela('nova-ordem-de-servico')" role="tab" aria-selected="false" aria-label="Nova Ordem">
          <div class="w-10 h-10 rounded-full bg-marca-500 flex items-center justify-center -mt-3" style="box-shadow: 0 3px 10px rgba(249,115,22,0.4);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <span class="text-[10px] font-semibold text-gray-400 mt-0.5">Nova OS</span>
        </button>
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 text-gray-400 flex-1" data-nav="financeiro" onclick="mostrarTela('financeiro')" role="tab" aria-selected="false" aria-label="Financeiro">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span class="text-[10px] font-semibold">Caixa</span>
        </button>
        <button class="btn-nav relative flex flex-col items-center justify-center gap-0.5 py-1.5 px-2 text-gray-400 flex-1" data-nav="relatorios" onclick="mostrarTela('relatorios')" role="tab" aria-selected="false" aria-label="Relatórios">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 5 4-3"/></svg>
          <span class="text-[10px] font-semibold">Relatórios</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b) {
        var ehAtivo = b.dataset.nav === id;
        b.classList.toggle('ativo', ehAtivo);
        b.classList.toggle('text-marca-500', ehAtivo);
        b.classList.toggle('text-gray-400', !ehAtivo);
        b.setAttribute('aria-selected', ehAtivo ? 'true' : 'false');
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function() {
      mostrarTela('dashboard');
    });

    var contadorAvisos = 0;
    function toast(mensagem, tipo) {
      tipo = tipo || 'info';
      var el = document.createElement('div');
      el.className = 'aviso';
      var cores = { ok: '#059669', erro: '#DC2626', info: '#F97316' };
      el.style.background = cores[tipo] || cores.info;
      el.textContent = mensagem;
      document.body.appendChild(el);
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
    }

    function abrirModal(html, titulo) {
      var container = document.getElementById('modal-container');
      container.innerHTML =
        '<div class="fixed inset-0 z-[150] flex items-end sm:items-center justify-center" onclick="if(event.target===this)fecharModal()">' +
          '<div class="absolute inset-0 bg-black/50"></div>' +
          '<div class="relative bg-white rounded-t-marca-xl sm:rounded-marca-xl w-full max-w-sm shadow-elevated overflow-hidden">' +
            '<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">' +
              '<h3 class="font-body font-bold text-base text-marca-800">' + (titulo || '') + '</h3>' +
              '<button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors" aria-label="Fechar">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
              '</button>' +
            '</div>' +
            '<div class="p-5 max-h-[70vh] overflow-y-auto">' + html + '</div>' +
          '</div>' +
        '</div>';
    }

    function fecharModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    function brl(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function dataBR(iso) {
      if (!iso) return '—';
      var partes = iso.split('-');
      return partes[2] + '/' + partes[1] + '/' + partes[0];
    }

    function gerarIniciais(nome) {
      if (!nome) return '?';
      var p = nome.trim().split(/\s+/);
      return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
    }

    function corAvatar(nome) {
      var cores = ['#7C2D12','#B45309','#C2410C','#059669','#0891B2','#7C3AED','#BE185D','#4338CA'];
      var hash = 0;
      for (var i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
      return cores[Math.abs(hash) % cores.length];
    }
  </script>
</body>
</html>
